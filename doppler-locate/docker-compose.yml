name: doppler-locate
services:
  engine:
    build:
      context: https://github.com/leo-aa88/aerodoppler.git#main
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - engine_data:/data
    environment:
      AERODOPPLER_OFFLINE: "false"
      AERODOPPLER_MAX_UPLOAD_MB: "2048"
    restart: unless-stopped
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:7070:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - engine
    restart: unless-stopped
volumes:
  engine_data:
