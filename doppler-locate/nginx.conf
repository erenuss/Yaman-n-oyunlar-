# GitHub Pages -> Codespaces 7070 CORS proxy
limit_req_zone $binary_remote_addr zone=video_uploads:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=archive_imports:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=client_conn:10m;
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256m;
  client_body_timeout 120s;
  limit_conn client_conn 5;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location / { try_files $uri $uri/ /index.html; }

  location = /api/audit { return 404; }
  location = /api/jobs { return 404; }

  location = /api/recordings {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
      add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type' always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    if ($request_method != POST) { return 405; }
    limit_req zone=video_uploads burst=1 nodelay;
    add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
    add_header Vary 'Origin' always;
    proxy_pass http://engine:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  location = /api/flight-datasets/import {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
      add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type' always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    if ($request_method != POST) { return 405; }
    limit_req zone=archive_imports burst=1 nodelay;
    add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
    add_header Vary 'Origin' always;
    proxy_pass http://engine:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type' always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    limit_except GET POST { deny all; }
    add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
    add_header Vary 'Origin' always;
    proxy_pass http://engine:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location = /health {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
      add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin 'https://erenuss.github.io' always;
    add_header Vary 'Origin' always;
    proxy_pass http://engine:8000/health;
  }
}
